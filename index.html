localStorage.setItem("ki",JSON.stringify(estado));

function show(id){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));
document.getElementById(id).classList.add("on");
if(id=="journey")jornadas();
if(id=="topics")assuntos();
if(id=="profile")perfil();
}



function texto(assunto,titulo){
  return "Nesta lição, você vai compreender o conceito de "+titulo+" dentro da área de "+assunto+". A proposta é entender o significado da ideia, como ela funciona, por que ela é importante e como pode aparecer em situações reais. O objetivo é construir uma compreensão que permita explicar o conceito com suas próprias palavras e reconhecê-lo quando ele aparecer na prática.";
}

  let explicacoes={
    "Efeito Dunning-Kruger":"O efeito Dunning-Kruger descreve uma situação em que pessoas com pouca experiência em determinada área podem ter dificuldade para reconhecer as próprias limitações. Para avaliar corretamente o próprio desempenho, também é necessário possuir conhecimento suficiente sobre aquilo que está sendo avaliado. Por isso, uma pessoa pode cometer erros sem perceber completamente que está errando. Com mais estudo, prática e feedback, a pessoa passa a compreender melhor a complexidade do assunto e consegue avaliar suas próprias capacidades com maior precisão.",

    "Memória de trabalho":"A memória de trabalho é o sistema mental utilizado para manter informações temporariamente disponíveis enquanto pensamos ou realizamos uma tarefa. Ela participa de situações como fazer uma conta mentalmente, seguir instruções com várias etapas, acompanhar uma conversa e comparar informações. Sua capacidade é limitada: quando muitas informações precisam ser mantidas ao mesmo tempo, aumenta a possibilidade de esquecimentos e erros. Dividir informações em partes, fazer anotações e reduzir distrações pode facilitar seu funcionamento.",

    "Viés de confirmação":"O viés de confirmação é a tendência de dar mais atenção a informações que apoiam uma crença que já possuímos e de dar menos importância a informações que a contradizem. Isso pode acontecer sem intenção consciente. Uma pessoa que acredita que determinado método funciona pode lembrar principalmente dos casos em que ele deu certo e explicar os fracassos por outros motivos. Para reduzir esse viés, é útil procurar evidências contrárias e perguntar quais informações poderiam fazer você mudar de opinião.",

    "Condicionamento clássico":"O condicionamento clássico é uma forma de aprendizagem baseada na associação entre estímulos. Um estímulo que inicialmente não produz determinada resposta pode passar a provocá-la depois de ser associado repetidamente a outro estímulo que naturalmente provoca essa resposta. O fenômeno ficou conhecido pelos estudos de Ivan Pavlov. Esse princípio ajuda a compreender algumas respostas emocionais e comportamentos aprendidos que surgem automaticamente diante de determinadas situações.",

    "Reforço e punição":"Reforço e punição são conceitos utilizados para compreender como consequências influenciam comportamentos. Reforço é uma consequência que aumenta a probabilidade de um comportamento voltar a acontecer, enquanto punição tende a diminuir essa probabilidade. O termo positivo significa adicionar algo e negativo significa retirar algo. Portanto, reforço negativo não significa castigo: significa retirar algo para aumentar um comportamento. Essa diferença é fundamental para compreender a aprendizagem comportamental.",

    "Atenção seletiva":"A atenção seletiva é a capacidade de direcionar os recursos mentais para determinadas informações enquanto outras recebem menos atenção. Como recebemos muitos estímulos simultaneamente, não conseguimos processar todos com a mesma profundidade. Nossos objetivos, expectativas, emoções e características dos estímulos influenciam aquilo que recebe prioridade. Isso explica por que conseguimos nos concentrar em uma conversa específica em um ambiente barulhento, mas também por que podemos deixar passar informações que não estavam no foco da nossa atenção."
  };

function responder(c){
if(c){
estado.xp+=15;
salvar();
alert("Acertou! +15 XP");
}else alert("Quase. Compreender e aplicar é mais forte do que apenas decorar.");
}

function concluir(a,i){
let k=a+"-"+i;
if(!estado.feito[k]){
estado.feito[k]=1;
estado.xp+=10;
salvar();
}
fechar();
feed();
jornadas();
}

function ouvir(a,i){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(dados[a][i]+". "+texto(a,dados[a][i]));
u.lang="pt-BR";
speechSynthesis.speak(u);
estado.xp+=5;
salvar();
}

function fechar(){
document.getElementById("modal").classList.remove("on");
}

function feed(){
let arr=[];
Object.keys(dados).forEach(a=>{
dados[a].forEach((t,i)=>arr.push({a,t,i}));
});
document.getElementById("feedList").innerHTML=arr.slice(0,40).map(x=>
'<article class="card">'+
'<span class="tag">'+x.a+' • Lição '+(x.i+1)+'</span>'+
'<h2>'+x.t+'</h2>'+
'<p>'+texto(x.a,x.t)+'</p>'+
'<button class="btn" onclick="abrir(\''+x.a+'\','+x.i+')">LER</button>'+
'<button class="btn ghost" onclick="ouvir(\''+x.a+'\','+x.i+')">OUVIR</button>'+
'</article>'
).join("");
}

function jornadas(){
document.getElementById("subjects").innerHTML=Object.keys(dados).map(a=>{
let n=dados[a].filter((_,i)=>estado.feito[a+"-"+i]).length;
return '<button class="subject" onclick="assunto(\''+a+'\')"><b>'+a+'</b><div class="sub">'+n+'/30 lições</div><div class="bar"><i style="width:'+(n/30*100)+'%"></i></div></button>';
}).join("");
}

function assuntos(){
document.getElementById("topicsList").innerHTML=Object.keys(dados).map(a=>
'<button class="subject" onclick="assunto(\''+a+'\')">📚 '+a+'<div class="sub">30 lições</div></button>'
).join("");
}

function assunto(a){
show("feed");
document.getElementById("feedList").innerHTML=dados[a].map((t,i)=>
'<article class="card"><span class="tag">'+a+' • Lição '+(i+1)+'</span><h2>'+t+'</h2><p>'+texto(a,t)+'</p><button class="btn" onclick="abrir(\''+a+'\','+i+')">LER</button></article>'
).join("");
}

function perfil(){
let nivel=Math.floor(estado.xp/100)+1;
document.getElementById("xp").textContent=estado.xp+" XP";
document.getElementById("level").textContent="Nível "+nivel;
document.getElementById("progress").textContent=Object.keys(estado.feito).length+" lições concluídas";
}

feed();
jornadas();
perfil();

</script>
