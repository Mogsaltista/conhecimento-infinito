<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conhecimento Infinito</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}header{padding:22px 18px 12px;position:sticky;top:0;background:#090b10ee;backdrop-filter:blur(12px);z-index:5}h1{margin:0;font-size:25px}h2{margin:12px 0 8px}.sub,p{color:#aab2c1;line-height:1.55}main{max-width:720px;margin:auto;padding:10px 16px 100px}.card,.subject{background:#121620;border:1px solid #252c39;border-radius:20px;padding:18px;margin:12px 0}.tag{display:inline-block;background:#272044;color:#cfc6ff;padding:6px 10px;border-radius:99px;font-size:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#7658ff;color:white;font-weight:700;margin:3px}.ghost{background:#202631}nav{position:fixed;bottom:0;left:0;right:0;background:#10141c;border-top:1px solid #252c39;display:flex;justify-content:space-around;padding:9px 4px;z-index:10}nav button{background:none;border:0;color:#aab2c1;font-size:12px}nav b{display:block;font-size:20px}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.subject{margin:0;text-align:left;color:white}.bar{height:7px;background:#292f39;border-radius:9px;margin-top:12px}.bar i{display:block;height:100%;background:#7658ff;border-radius:9px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:18px;overflow:auto}.modal.on{display:block}.sheet{max-width:700px;margin:30px auto;background:#121620;border-radius:22px;padding:22px}.opt{display:block;width:100%;background:#202631;color:white;border:0;border-radius:12px;padding:12px;margin:8px 0;text-align:left}.xp{color:#aa99ff;font-weight:800}
</style>
</head>
<body>

<header>
<h1>🧠 Conhecimento Infinito</h1>
<div class="sub" id="status">Aprenda no seu ritmo • conteúdo sem limite</div>
</header>

<main>

<div id="feed" class="page on">
<h2>Seu Feed</h2>
<div id="feedList"></div>
</div>

<div id="journey" class="page">
<h2>Jornadas</h2>
<p>30 lições em cada assunto. Avance no seu próprio ritmo.</p>
<div class="grid" id="subjects"></div>
</div>

<div id="topics" class="page">
<h2>Assuntos</h2>
<p>Escolha um assunto para explorar.</p>
<div class="grid" id="topicsList"></div>
</div>

<div id="profile" class="page">
<h2>Seu Perfil</h2>
<div class="card">
<div class="xp" id="xp"></div>
<h2 id="level"></h2>
<p id="progress"></p>
</div>
</div>

</main>

<nav>
<button onclick="show('feed')"><b>⌂</b>Feed</button>
<button onclick="show('journey')"><b>◈</b>Jornadas</button>
<button onclick="show('topics')"><b>◉</b>Assuntos</button>
<button onclick="show('profile')"><b>●</b>Perfil</button>
</nav>

<div class="modal" id="modal">
<div class="sheet" id="sheet"></div>
</div>

<script>

const dados={
"Psicologia":[
"Efeito Dunning-Kruger","Memória de trabalho","Viés de confirmação","Condicionamento clássico","Reforço e punição","Atenção seletiva","Efeito halo","Dissonância cognitiva","Heurística da disponibilidade","Profecia autorrealizável","Apego","Motivação","Emoções","Personalidade","Percepção social","Empatia","Hábitos","Autocontrole","Estresse","Aprendizagem","Cognição","Linguagem","Psicologia social","Influência social","Conformidade","Obediência","Identidade","Autoeficácia","Metacognição","Tomada de decisão"
],
"História":[
"Revolução Neolítica","Mesopotâmia","Egito Antigo","Grécia Antiga","Roma","Idade Média","Renascimento","Reforma Protestante","Revolução Científica","Iluminismo","Revolução Industrial","Revolução Francesa","Independência dos EUA","Independência do Brasil","Imperialismo","Primeira Guerra Mundial","Revolução Russa","Crise de 1929","Segunda Guerra Mundial","Guerra Fria","Descolonização","Ditadura no Brasil","Redemocratização","Globalização","China Imperial","Índia Antiga","Império Otomano","América pré-colombiana","História da África","História da Internet"
],
"Ciência":[
"Método científico","Átomos","Moléculas","Gravidade","Relatividade","Evolução","DNA","Células","Energia","Termodinâmica","Eletricidade","Magnetismo","Ondas","Luz","Som","Pressão","Clima","Placas tectônicas","Vulcões","Física quântica","Probabilidade","Vacinas","Antibióticos","Microrganismos","Ecossistemas","Ciclo da água","Carbono","Entropia","Sono","Como surgem hipóteses"
],
"Tecnologia":[
"Algoritmos","Internet","Web","Nuvem","Banco de dados","Criptografia","Inteligência Artificial","Machine Learning","Redes neurais","Computação quântica","Sistemas operacionais","CPU","GPU","RAM","Wi-Fi","GPS","Blockchain","Cibersegurança","Privacidade digital","APIs","Código aberto","Compiladores","UX","Interfaces","Robótica","Automação","Big Data","5G","Realidade virtual","Como um aplicativo funciona"
],
"Filosofia":[
"Sócrates","Platão","Aristóteles","Estoicismo","Epicurismo","Ceticismo","Agostinho","Maquiavel","Descartes","Spinoza","Hume","Kant","Nietzsche","Existencialismo","Utilitarismo","Ética","Virtude","Livre-arbítrio","Determinismo","Conhecimento","Verdade","Consciência","Identidade","Justiça","Política","Felicidade","Sentido da vida","Navio de Teseu","Dilema do bonde","Boa vida"
],
"Economia":[
"Oferta e demanda","Inflação","Juros","PIB","Desemprego","Produtividade","Moeda","Bancos","Crédito","Dívida","Impostos","Mercado","Concorrência","Monopólio","Comércio internacional","Câmbio","Globalização","Ciclos econômicos","Crise financeira","Poupança","Investimento","Risco","Custo de oportunidade","Incentivos","Externalidades","Bens públicos","Desigualdade","Capital humano","Empreendedorismo","Orçamento pessoal"
],
"Biologia":[
"Célula","DNA","RNA","Genes","Mutação","Seleção natural","Evolução","Ecossistemas","Cadeias alimentares","Fotossíntese","Respiração celular","Sistema nervoso","Neurônios","Hormônios","Imunidade","Bactérias","Vírus","Fungos","Microbioma","Genética","Hereditariedade","Adaptação","Biodiversidade","Extinção","Comportamento animal","Homeostase","Órgãos","Sangue","Sono e biologia","Como nasce uma espécie"
],
"Astronomia":[
"Sistema Solar","Sol","Lua","Eclipses","Marés","Planetas rochosos","Gigantes gasosos","Asteroides","Cometas","Cinturão de Kuiper","Exoplanetas","Estrelas","Nascimento estelar","Supernovas","Buracos negros","Galáxias","Via Láctea","Nebulosas","Matéria escura","Energia escura","Big Bang","Expansão do universo","Ondas gravitacionais","Relatividade","Vida no universo","Zona habitável","Telescópios","Ano-luz","Estação espacial","Distâncias cósmicas"
],
"Geografia":[
"Mapas","Latitude","Longitude","Fusos horários","Relevo","Clima","Tempo atmosférico","Ciclo da água","Rios","Bacias hidrográficas","Oceanos","Correntes marítimas","Placas tectônicas","Desertos","Florestas","Biomas","População","Urbanização","Migração","Densidade demográfica","Globalização","Fronteiras","Geopolítica","Recursos naturais","Agricultura","Energia","Mudanças climáticas","Brasil","América do Sul","Como interpretar um mapa"
]
};

let estado=JSON.parse(localStorage.getItem("ki")||'{"xp":0,"feito":{}}');

function salvar(){
localStorage.setItem("ki",JSON.stringify(estado));
perfil();
}

function show(id){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("on"));
document.getElementById(id).classList.add("on");
if(id=="journey")jornadas();
if(id=="topics")assuntos();
if(id=="profile")perfil();
}

function texto(assunto,titulo){
return "Este é um conceito fundamental de "+assunto.toLowerCase()+". A ideia é entender o que significa, como funciona, onde aparece e como se relaciona com outros conhecimentos. Em vez de apenas decorar o termo, procure explicar o conceito com suas próprias palavras e encontrar um exemplo na vida real.";
}

function abrir(a,i){
let t=dados[a][i];
document.getElementById("sheet").innerHTML=
'<span class="tag">'+a+' • Lição '+(i+1)+'/30</span>'+
'<h2>'+t+'</h2>'+
'<p>'+texto(a,t)+'</p>'+
'<h3>Entenda</h3>'+
'<p>O aprendizado fica mais sólido quando você conecta uma ideia nova a exemplos, compara conceitos e tenta explicar o assunto sem consultar a resposta.</p>'+
'<h3>Mini-quiz</h3>'+
'<p>Qual estratégia ajuda mais a aprender um conceito?</p>'+
'<button class="opt" onclick="responder(true)">Relacionar, explicar e aplicar.</button>'+
'<button class="opt" onclick="responder(false)">Apenas decorar o nome.</button>'+
'<br><button class="btn" onclick="concluir(\''+a+'\','+i+')">✓ Estudar lição +10 XP</button>'+
'<button class="btn ghost" onclick="ouvir(\''+a+'\','+i+')">🔊 Ouvir</button>'+
'<button class="btn ghost" onclick="fechar()">Fechar</button>';

document.getElementById("modal").classList.add("on");
}

function responder(c){
if(c){
estado.xp+=15;
salvar();
alert("Acertou! +15 XP");
}else alert("Quase. Compreender e aplicar é mais forte do que apenas decorar.");
}

function concluir(a,i){
let k=a+"-"+i;
if(!estado.feito[k]){
estado.feito[k]=1;
estado.xp+=10;
salvar();
}
fechar();
feed();
jornadas();
}

function ouvir(a,i){
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(dados[a][i]+". "+texto(a,dados[a][i]));
u.lang="pt-BR";
speechSynthesis.speak(u);
estado.xp+=5;
salvar();
}

function fechar(){
document.getElementById("modal").classList.remove("on");
}

function feed(){
let arr=[];
Object.keys(dados).forEach(a=>{
dados[a].forEach((t,i)=>arr.push({a,t,i}));
});
document.getElementById("feedList").innerHTML=arr.slice(0,40).map(x=>
'<article class="card">'+
'<span class="tag">'+x.a+' • Lição '+(x.i+1)+'</span>'+
'<h2>'+x.t+'</h2>'+
'<p>'+texto(x.a,x.t)+'</p>'+
'<button class="btn" onclick="abrir(\''+x.a+'\','+x.i+')">LER</button>'+
'<button class="btn ghost" onclick="ouvir(\''+x.a+'\','+x.i+')">OUVIR</button>'+
'</article>'
).join("");
}

function jornadas(){
document.getElementById("subjects").innerHTML=Object.keys(dados).map(a=>{
let n=dados[a].filter((_,i)=>estado.feito[a+"-"+i]).length;
return '<button class="subject" onclick="assunto(\''+a+'\')"><b>'+a+'</b><div class="sub">'+n+'/30 lições</div><div class="bar"><i style="width:'+(n/30*100)+'%"></i></div></button>';
}).join("");
}

function assuntos(){
document.getElementById("topicsList").innerHTML=Object.keys(dados).map(a=>
'<button class="subject" onclick="assunto(\''+a+'\')">📚 '+a+'<div class="sub">30 lições</div></button>'
).join("");
}

function assunto(a){
show("feed");
document.getElementById("feedList").innerHTML=dados[a].map((t,i)=>
'<article class="card"><span class="tag">'+a+' • Lição '+(i+1)+'</span><h2>'+t+'</h2><p>'+texto(a,t)+'</p><button class="btn" onclick="abrir(\''+a+'\','+i+')">LER</button></article>'
).join("");
}

function perfil(){
let nivel=Math.floor(estado.xp/100)+1;
document.getElementById("xp").textContent=estado.xp+" XP";
document.getElementById("level").textContent="Nível "+nivel;
document.getElementById("progress").textContent=Object.keys(estado.feito).length+" lições concluídas";
}

feed();
jornadas();
perfil();

</script>
</body>
</html>
